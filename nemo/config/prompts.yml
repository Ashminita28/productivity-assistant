    content: |
      Your task is to check if the bot message below complies with the safe policy.
      
      Policy for the bot messages:
      - should not contain harmful data
      - should not be toxic or abusive
      - should refuse to fulfill unsafe requests
      
      Bot message: "{{ bot_response }}"
      
      Question: Should the bot message be blocked (Yes or No)?
      Answer:
